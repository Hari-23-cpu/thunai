<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#070b14"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/>
  </marker>
</defs>

<rect width="1200" height="420" rx="24" fill="url(#bg)"/>

<text x="600" y="42" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="27" font-weight="700"
      fill="#f8fafc">
  THUNAI · AI CUSTOMER SUPPORT WORKFLOW
</text>

<g font-family="Arial, sans-serif">
  <g transform="translate(35 90)">
    <rect width="170" height="90" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="85" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Customer</text>
    <text x="85" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">Incoming message</text>
  </g>

  <g transform="translate(235 90)">
    <rect width="180" height="90" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Intent Agent</text>
    <text x="90" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">9-intent classification</text>
  </g>

  <g transform="translate(445 90)">
    <rect width="190" height="90" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="95" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Historical Retriever</text>
    <text x="95" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">TF-IDF evidence</text>
  </g>

  <g transform="translate(665 90)">
    <rect width="180" height="90" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="90" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Reply Agent</text>
    <text x="90" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">Conversational LLM</text>
  </g>

  <g transform="translate(875 90)">
    <rect width="190" height="90" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
    <text x="95" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Guardrails</text>
    <text x="95" y="62" text-anchor="middle" font-size="13" fill="#94a3b8">Grounding + capability</text>
  </g>

  <path d="M205 135 H230" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M415 135 H440" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M635 135 H660" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M845 135 H870" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(350 260)">
    <rect width="500" height="100" rx="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    <text x="250" y="37" text-anchor="middle" font-size="18" font-weight="700" fill="#f8fafc">Auto-handle / Escalate</text>
    <text x="250" y="61" text-anchor="middle" font-size="13" fill="#94a3b8">Evidence + capability are sufficient → respond</text>
    <text x="250" y="82" text-anchor="middle" font-size="13" fill="#94a3b8">Otherwise → explain limitation and escalate</text>
  </g>

  <path d="M970 180 C970 220 850 245 800 260"
        fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
</g>

<g filter="url(#glow)" fill="#60a5fa">
  <circle r="7">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M205 135 H230"/>
  </circle>
  <circle r="7">
    <animateMotion dur="2.2s" begin="0.55s" repeatCount="indefinite" path="M415 135 H440"/>
  </circle>
  <circle r="7">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M635 135 H660"/>
  </circle>
  <circle r="7">
    <animateMotion dur="2.2s" begin="1.65s" repeatCount="indefinite" path="M845 135 H870"/>
  </circle>
</g>
</svg>